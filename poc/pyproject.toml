[project]
name = "montybot-poc"
version = "0.0.0"
description = "Proof of concept: hand a remote agent's browser session to the user's machine and back."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
    "pydantic-ai-slim>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"
