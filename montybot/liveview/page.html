<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-visual: the phone's keyboard covers the page instead of shrinking it, so it does not resize the bot's. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual">
<title>Monty needs you</title>
<style>
  /* One screen, no scrolling: the picture takes whatever room the bars leave. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; font: 15px system-ui, sans-serif;
         background: #f3f4f6; color: #111827; }
  header { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px;
           background: #111827; color: #f9fafb; }
  header p { flex: 1; min-width: 0; margin: 0; }
  #back { background: #374151; color: #f9fafb; }
  nav { display: flex; gap: 8px; align-items: center; padding: 6px 14px; background: #e5e7eb; }
  nav #url { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #374151; }
  button { padding: 6px 12px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  #give-back { background: #34d399; font-weight: 600; }
  main { position: relative; flex: 1; min-height: 0; margin: 8px; }
  /* Centred and shrunk to fit main, keeping its shape; never stretched past its own size. */
  #view { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; background: #fff;
          touch-action: none; outline: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }
  #keys { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
          resize: none; }
  /* A line kept free, so the first status does not shrink the picture and resize the bot's page. */
  #status { margin: 0; padding: 0 14px 6px; min-height: 1.3em; line-height: 1.3; color: #374151;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <button id="back" hidden>Back to chat</button>
  <p id="reason">Connecting...</p>
  <button id="give-back" disabled>Give back to Monty</button>
</header>
<nav>
  <select id="tabs" aria-label="Tabs" hidden></select>
  <span id="url"></span>
  <button id="keyboard">Keyboard</button>
  <button id="use-here" hidden>Use here</button>
</nav>
<main>
  <canvas id="view" width="1280" height="720" aria-label="The bot's browser"></canvas>
  <textarea id="keys" aria-label="Keyboard input" autocapitalize="off" autocomplete="off" autocorrect="off"
            spellcheck="false"></textarea>
</main>
<p id="status" role="status"></p>
<script src="../live.js"></script>
</body>
</html>
