# The whole product on one server: Postgres with a nightly backup, the app with its jailed browsers, and Caddy for
# HTTPS. deploy/deploy.sh runs it on the VM with the settings in /opt/montybot/.env (made by deploy/bootstrap.sh).
# Networks: Caddy and the app share `edge`; the app, Postgres and the backup share `db`. The browsers reach neither:
# their only way out is the app's egress proxy, which refuses private addresses (montybot/browser/egress.py).
name: montybot

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: montybot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: montybot
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U montybot']
      interval: 2s
      retries: 30
    networks: [db]

  # pg_dump every night at BACKUP_AT (UTC) into /opt/montybot/backups, keeping BACKUP_KEEP_DAYS days of dumps.
  # One now: `docker compose exec backup backup now`. Restore: deploy/backup.sh says how.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: montybot
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: montybot
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['/usr/local/bin/backup']
    volumes:
      - ./backup.sh:/usr/local/bin/backup:ro
      - ${BACKUP_DIR:-/opt/montybot/backups}:/backups
    networks: [db]

  app:
    build:
      context: ..
    image: montybot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://montybot:${POSTGRES_PASSWORD:?}@postgres:5432/montybot
      SESSION_SECRET: ${SESSION_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      HOST: 0.0.0.0
      PORT: '8000'
      PUBLIC_URL: https://${DOMAIN:?}
      SECURE_COOKIES: 'true'
      EXECUTOR_ID: vm-1
      MODEL: ${MODEL:-claude-code:claude-opus-5-5}
      BROWSER_BACKEND: ${BROWSER_BACKEND:-montybot.engines:chromium_server}
      CLAUDE_CODE_CREDENTIALS: file
      CLAUDE_CODE_AUTH_FILE: /data/claude-code/auth.json
      WORKSPACES_DIR: /data/workspaces
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - claude-code:/data/claude-code
      - workspaces:/data/workspaces
    # bwrap makes new namespaces for each Chrome. Docker's defaults forbid that, so (see deploy/README.md):
    # - seccomp.json is Docker's default profile plus the namespace and mount calls bwrap makes;
    # - AppArmor: docker-default refuses bwrap's mounts, so the container runs unconfined and the host's `bwrap`
    #   profile (deploy/bootstrap.sh) is the one program allowed to make user namespaces;
    # - systempaths: the kernel refuses a fresh /proc while Docker masks paths under /proc;
    # - no capabilities but SYS_CHROOT, which Chrome's own sandbox needs inside its user namespace.
    # bwrap is the boundary between browsers; the container is not.
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges
      - seccomp=./seccomp.json
      - apparmor=unconfined
      - systempaths=unconfined
    shm_size: 1gb
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 60
    networks: [edge, db]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  edge: {}
  db: {}

volumes:
  postgres: {}
  claude-code: {}
  workspaces: {}
  caddy-data: {}
  caddy-config: {}
