# The whole product on one server: Postgres with a nightly backup, the app with its jailed browsers, and Caddy for
# HTTPS. deploy/deploy.sh runs it on the VM with the settings in /opt/sammy/.env (made by deploy/bootstrap.sh).
# Networks: Caddy and the app share `edge`; the app, Postgres and the backup share `db`. The browser-egress
# sidecar is only on its own internet-facing bridge, with no db network or app credentials. The public Caddy URL
# remains reachable as it is from any internet client, under basic auth. Browsers in bwrap use a read-only mounted
# Unix socket directory to reach the proxy.
name: sammy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sammy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: sammy
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sammy']
      interval: 2s
      retries: 30
    networks: [db]

  # pg_dump every night at BACKUP_AT (UTC) into /opt/sammy/backups, keeping BACKUP_KEEP_DAYS days of dumps.
  # One now: `docker compose exec backup backup now`. Restore: deploy/backup.sh says how.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: sammy
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: sammy
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['/usr/local/bin/backup']
    volumes:
      - ./backup.sh:/usr/local/bin/backup:ro
      - ${BACKUP_DIR:-/opt/sammy/backups}:/backups
    networks: [db]

  # The only process resolving browser destinations. It has internet access, but no route to the db bridge and no
  # app credentials. The app shares only this Unix socket directory, not a Docker network, with the proxy.
  browser-egress:
    build:
      context: ..
      args:
        COMMIT: ${COMMIT:-}
    image: sammy-app
    command: ['python', '-m', 'sammy.browser.egress_server', '/run/browser-egress/proxy.sock']
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 512m
    volumes:
      - browser-egress:/run/browser-egress
    networks: [browser-egress]
    healthcheck:
      test: ['CMD', 'python', '-c', "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/browser-egress/proxy.sock')"]
      interval: 5s
      retries: 12

  app:
    build:
      context: ..
      args:
        COMMIT: ${COMMIT:-}
    image: sammy-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browser-egress:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sammy:${POSTGRES_PASSWORD:?}@postgres:5432/sammy
      SESSION_SECRET: ${SESSION_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      HOST: 0.0.0.0
      PORT: '8000'
      PUBLIC_URL: https://${DOMAIN:?}
      SECURE_COOKIES: 'true'
      EXECUTOR_ID: vm-1
      MODEL: ${MODEL:-claude-code:claude-opus-5-5}
      MODEL_CHAINS: ${MODEL_CHAINS:-{}}
      # Chrome over our own CDP pipe (sammy/browser/cdp.md). Roll back to Playwright with
      # BROWSER_BACKEND=sammy.engines:chromium_server in /opt/sammy/.env.
      BROWSER_BACKEND: ${BROWSER_BACKEND:-sammy.engines:chromium_cdp_server}
      BROWSER_MAX_OPEN: ${BROWSER_MAX_OPEN:-8}
      BROWSER_EGRESS_SOCKET: /run/browser-egress/proxy.sock
      CLAUDE_CODE_CREDENTIALS: file
      CLAUDE_CODE_AUTH_FILE: /data/claude-code/auth.json
      WORKSPACES_DIR: /data/workspaces
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_THRESHOLD: ${JEV_THRESHOLD:-0.8}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_INCLUDE_CONTENT: ${LOGFIRE_INCLUDE_CONTENT:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONTY_URL: ${MONTY_URL:-}
      MONTY_EXECUTION_KEY: ${MONTY_EXECUTION_KEY:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    volumes:
      - claude-code:/data/claude-code
      - workspaces:/data/workspaces
      - browser-egress:/run/browser-egress:ro
    # bwrap makes new namespaces for each Chrome. Docker's defaults forbid that, so (see deploy/README.md):
    # - seccomp.json is Docker's default profile plus the namespace and mount calls bwrap makes;
    # - AppArmor: docker-default refuses bwrap's mounts, so the container runs unconfined and the host's `bwrap`
    #   profile (deploy/bootstrap.sh) is the one program allowed to make user namespaces;
    # - systempaths: the kernel refuses a fresh /proc while Docker masks paths under /proc;
    # - no capabilities but SYS_CHROOT, which Chrome's own sandbox needs inside its user namespace.
    # bwrap is the boundary between browsers; the container is not.
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges
      - seccomp=./seccomp.json
      - apparmor=unconfined
      - systempaths=unconfined
    shm_size: 1gb
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 60
    networks: [edge, db]

  # Installed manually by build-monty.sh; never fetched from a registry or built by app CD.
  monty-server:
    profiles: [full-monty]
    image: sammy-monty-server:${MONTY_PRIVATE_COMMIT:-not-installed}
    pull_policy: never
    restart: unless-stopped
    # Both services default to a 30s drain window; allow it to finish before SIGKILL.
    stop_grace_period: 60s
    environment:
      MONTY_SERVER_WORKER_URL: ws://monty-worker:8000/
      MONTY_SERVER_OBJECT_STORE_URI: file:///var/lib/monty-server
      MONTY_SERVER_DEFAULT_PERSISTENCE: stored
    volumes:
      # The private Dockerfile creates this path owned by 65532:65532; fresh volumes inherit it.
      - monty-sessions:/var/lib/monty-server
    networks: [edge, monty]
    depends_on: [monty-worker]

  monty-worker:
    profiles: [full-monty]
    image: sammy-monty-worker:${MONTY_PRIVATE_COMMIT:-not-installed}
    pull_policy: never
    restart: unless-stopped
    # Both services default to a 30s drain window; allow it to finish before SIGKILL.
    stop_grace_period: 60s
    environment:
      MONTY_WORKER_MAX_SESSIONS: '32'
      MONTY_WORKER_MAX_MEMORY_MIB: '256'
    # Only the relay reaches this tier. No published ports or external network.
    networks: [monty]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  edge: {}
  db: {}
  monty:
    internal: true
  browser-egress: {}

volumes:
  monty-sessions: {}
  postgres: {}
  claude-code: {}
  workspaces: {}
  browser-egress: {}
  caddy-data: {}
  caddy-config: {}
