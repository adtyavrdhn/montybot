# Local development: Postgres. `docker compose up -d`, then `uv run sammy serve` with the settings in `.env` (copy
# `.env.example`). #7 grows this into the whole product on one server.
#
# The agent's code runs on the hosted Monty sandboxes (MONTY_URL and MONTY_EXECUTION_KEY in `.env`). Our own Full
# Monty (monty-server relaying to monty-worker) is kept behind the `full-monty` profile and no longer starts by
# default: `docker compose --profile full-monty up -d` and MONTY_URL=ws://127.0.0.1:8100 to use it again. Its images
# build from a checkout of monty-private, `../monty-private` unless MONTY_PRIVATE_DIR says otherwise.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sammy
      POSTGRES_PASSWORD: sammy
      POSTGRES_DB: sammy
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sammy']
      interval: 2s
      retries: 30

  monty-server:
    profiles: [full-monty]
    build:
      context: ${MONTY_PRIVATE_DIR:-../monty-private}
      dockerfile: crates/monty-server/Dockerfile
    environment:
      MONTY_SERVER_WORKER_URL: ws://monty-worker:8000/
      # Sessions are parked here while a run waits, so they outlive a restart.
      MONTY_SERVER_OBJECT_STORE_URI: file:///var/lib/monty-server
      MONTY_SERVER_DEFAULT_PERSISTENCE: stored
    volumes:
      - monty-sessions:/var/lib/monty-server
    ports:
      - '127.0.0.1:8100:8000'
    depends_on:
      - monty-worker

  monty-worker:
    profiles: [full-monty]
    build:
      context: ${MONTY_PRIVATE_DIR:-../monty-private}
      dockerfile: crates/monty-worker/Dockerfile
    environment:
      MONTY_WORKER_MAX_SESSIONS: '16'
      MONTY_WORKER_MAX_MEMORY_MIB: '256'
    # no ports: only monty-server reaches the worker

volumes:
  postgres: {}
  monty-sessions: {}
