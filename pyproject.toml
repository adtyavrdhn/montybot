[dependency-groups]
dev = [
    "anyio>=4.4",
    "e2b-desktop>=2.6.1",
    "playwright>=1.63",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["poc", "*.md"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["montybot", "tests"]
strict = ["montybot"]
pythonVersion = "3.11"
