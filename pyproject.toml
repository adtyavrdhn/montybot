[project]
name = "montybot"
version = "0.0.0"
description = "An always-on agent built on Monty and Pydantic AI, with a browser it can hand to the user."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.4",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["poc", "*.md"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["montybot", "tests"]
strict = ["montybot"]
pythonVersion = "3.11"
