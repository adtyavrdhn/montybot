[project]
name = "montybot"
version = "0.0.0"
description = "An always-on agent built on Monty and Pydantic AI, with a browser it can hand to the user."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "dbos>=3.2.0",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "logfire>=4.41",
    "playwright>=1.63",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.11",
    "pydantic-ai-slim[anthropic,dbos,openai]>=2.54.0",
    "pydantic-monty>=1.1.0",
    "pydantic-settings>=2.15",
    "pywebpush>=2.0",
    "starlette>=1.0",
    "uvicorn[standard]>=0.40",
    "websockets>=13",
]

[project.scripts]
montybot = "montybot.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.4",
    "e2b-desktop>=2.6.1",
    "pillow>=11",
    "playwright>=1.63",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "u1: user path U1, read the web",
    "u2: user path U2, sign in once, reuse later",
    "u3: user path U3, act with approval",
    "u4: user path U4, scheduled tasks and watches",
    "u5: user path U5, files",
    "u6: user path U6, a bot check the user solves",
    "live: real sites and a real model, nightly only (--live)",
    "scripted: only meaningful with the scripted model (skipped when MONTYBOT_TEST_MODEL is set)",
    "deploy: the deployed stack in Docker (deploy/compose.yaml), only with MONTYBOT_TEST_DEPLOY=1",
]

[tool.ruff]
line-length = 120
extend-exclude = ["poc", "*.md", "montybot/vendor/claude_code"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["montybot", "tests"]
exclude = ["montybot/vendor/claude_code"]
strict = ["montybot"]
pythonVersion = "3.11"
