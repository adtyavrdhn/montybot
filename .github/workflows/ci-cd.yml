name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_PYTHON: '3.14'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check montybot tests
      - run: uv run ruff format --check montybot tests
      - run: uv run pyright
      - name: Validate production Compose configuration
        run: DOMAIN=localhost POSTGRES_PASSWORD=test SESSION_SECRET=test ENCRYPTION_KEY=test BASIC_AUTH_USER=test BASIC_AUTH_HASH=test docker compose -f deploy/compose.yaml config --quiet

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Chromium modules together on one worker: headed conformance and server launch tests
          # start authenticated Xvfb sessions. Overlapping sessions failed X authentication under -n 4 (#41).
          - name: unit
            workers: 4
            args: >-
              --ignore=tests/e2e --ignore=tests/browser/test_chromium.py --ignore=tests/browser/test_chromium_linux.py
              --ignore=tests/browser/test_cdp.py
          - name: browser-serial
            workers: 0
            args: tests/browser/test_chromium.py tests/browser/test_chromium_linux.py
          - name: e2e-fake
            workers: 4
            args: tests/e2e
          - name: e2e-chromium
            workers: 4
            args: tests/e2e --browser=chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 30
        ports:
          - 5432:5432
    env:
      MONTYBOT_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Ubuntu 24.04 only lets AppArmor-profiled programs make user namespaces, which Chromium's sandbox and bwrap
      # need; on this throwaway runner the restriction is simply off (the server allows only bwrap, see
      # deploy/README.md). Xvfb, bwrap and socat are for the real server launch tests in test_chromium_linux.py.
      - name: Allow user namespaces, install browser and CPython dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb bubblewrap socat python3-pandas python3-pypdf
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -p no:cacheprovider -n ${{ matrix.workers }} --durations=10 ${{ matrix.args }}

  # Servo is evaluated, not deployed (#18): its conformance, unjailed and in the server's jail (bwrap, no network but
  # the egress proxy, WebDriver only on a Unix socket). Not a deploy gate. The release is pinned by its SHA-256.
  servo-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SERVO_SHA256: 728eba1be1cc1851e05dfaa90e18f98ab8644dd2355bedb0b8a5e89795ebe333
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Allow user namespaces, install bwrap, socat and servoshell's libraries
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap socat \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 \
            libegl1 libegl-mesa0 libgl1-mesa-dri fontconfig fonts-dejavu-core
      - name: Servo 0.7.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/servo.tar.gz" \
            https://github.com/servo/servo/releases/download/v0.7.0/servo-x86_64-linux-gnu.tar.gz
          echo "$SERVO_SHA256  $RUNNER_TEMP/servo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/servo.tar.gz" -C "$RUNNER_TEMP"
          echo "MONTYBOT_SERVO_BINARY=$RUNNER_TEMP/servo/servoshell" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest -q -p no:cacheprovider -rs tests/browser/test_servo.py tests/browser/test_egress.py

  # Lightpanda is evaluated, not deployed (#18): its conformance, unjailed and in the server's jail (bwrap, no network
  # but the egress proxy, CDP only on a Unix socket). Not a deploy gate. The release binary is pinned by its SHA-256.
  lightpanda-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIGHTPANDA_SHA256: aa5a4b8ed53d1e38b3c73f5b2647d0a84a82e6744557f45f9a9c85858aa031c3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Allow user namespaces, install bwrap and socat
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap socat
      - name: Lightpanda 1.0.0
        run: |
          mkdir -p "$RUNNER_TEMP/lightpanda"
          curl -fsSL -o "$RUNNER_TEMP/lightpanda/lightpanda" \
            https://github.com/lightpanda-io/browser/releases/download/1.0.0/lightpanda-x86_64-linux
          echo "$LIGHTPANDA_SHA256  $RUNNER_TEMP/lightpanda/lightpanda" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/lightpanda/lightpanda"
          echo "MONTYBOT_LIGHTPANDA_BINARY=$RUNNER_TEMP/lightpanda/lightpanda" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest -q -p no:cacheprovider -rs tests/browser/test_lightpanda.py tests/browser/test_egress.py

  # Chrome over our own CDP pipe, no Playwright at runtime, is evaluated, not deployed (cdp.md): its conformance,
  # unjailed and in the server's jail (headed on Xvfb, bwrap, no network but the egress proxy), its live view, and the
  # end-to-end suite. Not a deploy gate. Chrome for Testing is pinned by its SHA-256: the build Playwright 1.63 runs.
  chromium-cdp-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 30
        ports:
          - 5432:5432
    env:
      MONTYBOT_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CHROME_VERSION: 153.0.8010.12
      CHROME_SHA256: 8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Allow user namespaces, install Xvfb, bwrap, socat and CPython dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb bubblewrap socat python3-pandas python3-pypdf
      - run: uv sync --locked
      - name: Chrome for Testing, and the system libraries it loads
        run: |
          curl -fsSL -o "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
          echo "MONTYBOT_CHROME_BINARY=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      # Not the engine: the end-to-end tests drive the web app as its user would, in Playwright's headless shell.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -q -p no:cacheprovider -rs tests/browser/test_cdp.py tests/browser/test_egress.py
      - run: uv run pytest -q -p no:cacheprovider -rs tests/liveview/test_liveview_engines.py -k cdp
      - run: uv run pytest -q -p no:cacheprovider -n 4 --durations=10 tests/e2e --browser=cdp

  # CloakBrowser in place of Chrome under the same CDP backend is evaluated, not deployed (cloak.md): its conformance,
  # unjailed and in the server's jail, its live view, and the end-to-end suite. Not a deploy gate. Its license forbids redistribution,
  # so each run downloads the free build from GitHub Releases, pinned by SHA-256 and checked against CloakHQ's signed
  # SHA256SUMS (tests/linux/fetch_cloak.sh). No license key.
  cloak-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 30
        ports:
          - 5432:5432
    env:
      MONTYBOT_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The fonts are the baseline from CloakBrowser's README (emoji and CJK for canvas hashes).
      - name: Allow user namespaces, install Xvfb, bwrap, socat, fonts and CPython dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb bubblewrap socat python3-pandas python3-pypdf \
            fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont fonts-ipafont-gothic fonts-wqy-zenhei \
            fonts-tlwg-loma-otf
      - run: uv sync --locked
      # Playwright's install brings the system libraries Chromium loads. Its headless shell is not the engine: the
      # end-to-end tests drive the web app as its user would, in it.
      - run: uv run playwright install --with-deps --only-shell chromium
      - name: CloakBrowser, free build, verified
        run: echo "MONTYBOT_CLOAK_BINARY=$(sh tests/linux/fetch_cloak.sh "$RUNNER_TEMP/cloak")" >> "$GITHUB_ENV"
      - run: uv run pytest -q -p no:cacheprovider -rs tests/browser/test_cloak.py
      - run: uv run pytest -q -p no:cacheprovider -rs tests/liveview/test_liveview_engines.py -k cloak
      - run: uv run pytest -q -p no:cacheprovider -n 4 --durations=10 tests/e2e --browser=cloak

  sidecar-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOMAIN: localhost
      POSTGRES_PASSWORD: test-password
      SESSION_SECRET: test-session
      ENCRYPTION_KEY: bW9udHlib3QtdGVzdC1rZXktMzItYnl0ZXMtbG9uZyE=
      BASIC_AUTH_USER: test
      BASIC_AUTH_HASH: test
      MODEL: script:e2e.scripts:model
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start the actual Compose stack with the scripted model
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.smoke.yaml up -d --build --wait --wait-timeout 240 app || {
            docker compose -f deploy/compose.yaml -f deploy/compose.smoke.yaml ps
            docker compose -f deploy/compose.yaml -f deploy/compose.smoke.yaml logs --no-color --tail=100 app browser-egress
            exit 1
          }
      - name: Browser uses sidecar to reach public sites but not Postgres
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.smoke.yaml exec -T app python - <<'PY'
          import asyncio
          from montybot.browser.contract import ActionFailed, Navigate
          from montybot.engines import chromium_cdp_server, chromium_server

          # The default (CDP) and the Playwright engine kept to roll back to.
          async def check(make):
              browser = make()
              await browser.open(None)
              try:
                  try:
                      await browser.act(Navigate(url='http://postgres:5432/'))
                  except ActionFailed as error:
                      assert 'ERR_SOCKS_CONNECTION_FAILED' in str(error), error
                  else:
                      raise AssertionError('Chrome reached the database')
                  await browser.act(Navigate(url='https://example.com/'))
                  page = await browser.snapshot()
                  print(make.__name__, 'public page:', repr(page.url), repr(page.title), repr(page.text[:500]))
                  assert 'Example Domain' in (page.title + page.text)
              finally:
                  await browser.close()

          for make in (chromium_cdp_server, chromium_server):
              asyncio.run(check(make))
          PY
      - if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.smoke.yaml down --volumes --remove-orphans

  deploy:
    needs: [lint, test, sidecar-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SSH key and host
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm
          chmod 600 ~/.ssh/vm
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          MONTY_EXECUTION_KEY: ${{ secrets.MONTY_EXECUTION_KEY }}
        run: SSH_KEY="$HOME/.ssh/vm" sh deploy/deploy.sh "${{ vars.VM_USER }}@${{ vars.VM_HOST }}"
