name: Nightly user paths

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-user-paths
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paths:
    # Paid calls are explicitly enabled by a maintainer, never from a PR. Missing credentials fail clearly.
    if: vars.ENABLE_NIGHTLY_MODEL_TESTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: fixture-paths
            args: 'tests/e2e --browser=chromium -m "u1 or u2 or u3 or u4 or u5 or u6"'
          - name: live-sites
            args: 'tests/e2e/test_live.py --live --browser=chromium'
    name: '${{ matrix.name }} (real model)'
    env:
      UV_PYTHON: '3.14'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONTYBOT_TEST_MODEL: anthropic:claude-sonnet-4-5
      MONTYBOT_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Check opt-in credentials
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'ENABLE_NIGHTLY_MODEL_TESTS requires the ANTHROPIC_API_KEY secret.'
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - name: Browser and Python prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap xvfb python3-pandas python3-pypdf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      # Sequential tests make site challenges and failures easier to diagnose and cap simultaneous paid calls.
      # No page/trace artifacts are uploaded: live pages and human sessions must not enter CI artifacts.
      - run: timeout 12m uv run pytest -q -p no:cacheprovider --durations=10 ${{ matrix.args }}
